# Checks arcraiders.com once a day and, when there are new or changed posts,
# opens (or updates) a "Sync official news" pull request for review.
#
# Needs the repository secret ANTHROPIC_API_KEY for Chinese translations; without
# it the PR still brings in the English posts. Scheduled runs only start once this
# file is on the default branch. The PR step also needs Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests".

name: News sync

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch and translate
        run: node scripts/fetch-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: news-sync
          delete-branch: true
          add-paths: |
            content/news.js
            content/news-zh.json
            content/news-img
          commit-message: Sync official news from arcraiders.com
          author: HedgehogsGX <203076171+HedgehogsGX@users.noreply.github.com>
          committer: HedgehogsGX <203076171+HedgehogsGX@users.noreply.github.com>
          title: Sync official news
          body: |
            New or updated posts from https://arcraiders.com/news, fetched by the daily News sync workflow.
            Chinese is translated with the official in-game terms; posts show English until a translation exists.
