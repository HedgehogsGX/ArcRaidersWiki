# Checks arcraiders.com once a day and, when there are new or changed posts,
# opens (or updates) a "Sync official news" pull request for review. The home
# page figure is not part of it: scripts/fetch-store-skin.py is run by hand.
#
# Needs the repository secret DEEPSEEK_API_KEY for Chinese translations; without
# it the PR still brings in the English posts. To translate with another
# OpenAI-compatible provider, set the repository variables TRANSLATE_BASE_URL and
# TRANSLATE_MODEL and pass its key instead. Scheduled runs only start once this
# file is on the default branch. The PR step also needs Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests".
#
# A manual run on any other branch is a test: instead of opening the PR, it
# uploads the files it would have changed as the "news-sync" artifact.

name: News sync

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch and translate
        run: node scripts/fetch-news.mjs
        env:
          TRANSLATE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATE_BASE_URL: ${{ vars.TRANSLATE_BASE_URL }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}

      - name: Upload the result of a test run
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: news-sync
          path: |
            content/news.js
            content/news-zh.json

      - name: Open pull request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: news-sync
          delete-branch: true
          add-paths: |
            content/news.js
            content/news-zh.json
            content/news-img
          commit-message: Sync official news from arcraiders.com
          author: HedgehogsGX <203076171+HedgehogsGX@users.noreply.github.com>
          committer: HedgehogsGX <203076171+HedgehogsGX@users.noreply.github.com>
          title: Sync official news
          body: |
            New or updated posts from https://arcraiders.com/news, fetched by the daily News sync workflow.
            Chinese is translated with the official in-game terms; posts show English until a translation exists.
