# Checks arcraiders.com every 30 minutes and, when there are new or changed posts,
# commits them straight to main, and both hosts redeploy from there. The home
# page figure is not part of it: scripts/fetch-store-skin.py is run by hand.
#
# Like map conditions, this skips the pull request, so new posts go live as soon
# as they are fetched instead of waiting for a merge. Translations are cached and
# nothing is committed when the news is unchanged, so most runs do no work.
#
# Needs the repository secret DEEPSEEK_API_KEY for Chinese translations; without
# it the sync still brings in the English posts. To translate with another
# OpenAI-compatible provider, set the repository variables TRANSLATE_BASE_URL and
# TRANSLATE_MODEL and pass its key instead. Scheduled runs only start once this
# file is on the default branch.
#
# A manual run on any other branch is a test: instead of committing to main, it
# uploads the files it would have changed as the "news-sync" artifact.

name: News sync

on:
  schedule:
    - cron: '17,47 * * * *' # every 30 minutes; GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch and translate
        run: node scripts/fetch-news.mjs
        env:
          TRANSLATE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATE_BASE_URL: ${{ vars.TRANSLATE_BASE_URL }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}

      - name: Upload the result of a test run
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: news-sync
          path: |
            content/news.js
            content/news-zh.json

      - name: Commit to main when it changed
        if: github.ref == 'refs/heads/main'
        run: |
          git add content/news.js content/news-zh.json content/news-img
          if git diff --cached --quiet; then
            echo "News unchanged."
            exit 0
          fi
          git config user.name HedgehogsGX
          git config user.email 203076171+HedgehogsGX@users.noreply.github.com
          git commit --quiet -m "Sync official news from arcraiders.com"
          # main may have moved since checkout; this job only touches its own files.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
